<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Shadows of Kanchi</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: full-screen WebGL view; HUD, subtitles and touch pads float above it. Single dark cinematic look by design. */
:root{
  color-scheme: dark;
  --night:#0f0a17;
  --ink:#f4ede2;
  --gold:#e9b65c;
  --violet:#a78bfa;
  --violet-deep:#5b3fa8;
  --panel:rgba(14,9,22,.72);
  --display:'Marcellus','Palatino Linotype',Georgia,serif;
  --body:'Alegreya Sans','Trebuchet MS',system-ui,sans-serif;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--body);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.layer{position:fixed;inset:0;pointer-events:none}
#hud{display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  transition:opacity .5s}
#eye{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:999px;padding:7px 14px 7px 10px;font-weight:700;font-size:13px;letter-spacing:.03em}
#eye i{width:22px;height:10px;border-radius:50%;background:#3d3150;transition:background .2s,box-shadow .2s}
#eye.on i{background:var(--violet);box-shadow:0 0 12px var(--violet)}
#chap{font-family:var(--display);font-size:15px;letter-spacing:.06em;opacity:.85;text-shadow:0 1px 6px #000}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(560px,calc(100vw - 32px));
  background:var(--panel);border-radius:10px;padding:10px 16px 12px;opacity:0;transition:opacity .35s;backdrop-filter:blur(4px)}
#toast.show{opacity:1}
#toast b{display:block;font-family:var(--display);font-weight:400;font-size:12px;letter-spacing:.14em;margin-bottom:3px}
#toast p{margin:0;font-size:17px;line-height:1.35}
.sp-ILAN b,.sp-VO b{color:var(--gold)} .sp-NIZHAL b{color:var(--violet)} .sp-VO p{font-style:italic}
.sp-HINT p{color:#f0d9ad}
.bar{position:fixed;left:0;right:0;height:0;background:#000;transition:height .8s cubic-bezier(.6,0,.2,1)}
.bar.t{top:0}.bar.b{bottom:0}
body.cine .bar{height:11vh}
#sub{position:fixed;left:50%;bottom:calc(11vh + 18px);transform:translateX(-50%);width:min(760px,calc(100vw - 32px));text-align:center;opacity:0;transition:opacity .4s}
#sub.show{opacity:1}
#sub b{display:block;font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.18em;margin-bottom:6px}
#sub p{margin:0;font-size:clamp(17px,2.3vw,23px);line-height:1.4;text-shadow:0 2px 10px #000,0 0 2px #000}
#sub small{display:block;margin-top:10px;font-size:12px;opacity:.55;letter-spacing:.06em}
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;
  background:radial-gradient(ellipse at 50% 55%,rgba(10,6,16,.15),rgba(10,6,16,.7));transition:opacity 1s}
#title .k{font-family:var(--display);font-size:13px;letter-spacing:.32em;color:var(--violet)}
#title h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,88px);line-height:1;letter-spacing:.02em;
  text-wrap:balance;text-shadow:0 0 40px rgba(124,58,237,.65),0 2px 0 rgba(0,0,0,.5)}
#title .s{font-style:italic;font-size:clamp(17px,2.4vw,22px);color:#f0d9ad}
#title .go{margin-top:26px;font-size:15px;opacity:.75;animation:pulse 2.4s infinite}
#title .keys{font-size:13px;opacity:.55;margin-top:6px}
@keyframes pulse{50%{opacity:.35}}
#death{display:grid;place-items:center;background:radial-gradient(ellipse,rgba(10,5,18,.2),rgba(10,5,18,.75));opacity:0;transition:opacity .4s}
#death.show{opacity:1}
#death p{font-style:italic;font-size:clamp(20px,3vw,28px);color:var(--gold);max-width:80vw;text-align:center;text-shadow:0 2px 12px #000}
#credits{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(8,5,14,.86);opacity:0;transition:opacity 1.6s}
#credits.show{opacity:1}
#credits .k{font-family:var(--display);letter-spacing:.3em;font-size:13px;color:var(--violet)}
#credits h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,48px)}
#credits p{margin:0;font-size:17px}
#credits .n{font-style:italic;color:#f0d9ad}
#loading{display:grid;place-items:center;background:var(--night);font-family:var(--display);letter-spacing:.2em;font-size:14px;color:#cbbfe6;transition:opacity .8s}
#err{display:none;position:fixed;inset:auto 16px 16px 16px;background:#3a1020;padding:12px 16px;border-radius:8px;font-size:14px}
.hide{opacity:0!important}
#controls{position:fixed;inset:0;pointer-events:none;transition:opacity .4s}
body.cine #controls{opacity:.15}
#stickZone{position:absolute;left:0;bottom:0;width:46vw;height:80vh;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:1.5px solid rgba(203,191,230,.4);
  background:radial-gradient(circle,rgba(14,9,22,.12),rgba(14,9,22,.45));transition:opacity .25s}
#stickKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(244,237,226,.22);
  border:1.5px solid rgba(244,237,226,.7);box-shadow:0 2px 10px rgba(0,0,0,.4)}
#stickZone.idle #stickBase{opacity:.5}
#stickHint{position:absolute;left:0;width:128px;margin-left:-64px;text-align:center;font:700 12px var(--body);letter-spacing:.06em;color:#e7defa;text-shadow:0 1px 4px #000;transition:opacity .4s}
#rpad{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:214px;height:196px}
.btn{position:absolute;pointer-events:auto;border-radius:50%;border:1.5px solid rgba(203,191,230,.45);background:rgba(14,9,22,.42);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;touch-action:none;backdrop-filter:blur(3px);
  transition:transform .08s,background .15s,box-shadow .2s;font:700 11px/1 var(--body);letter-spacing:.08em;padding:0}
.btn span{font-size:22px;line-height:1}
.btn.jump{right:0;bottom:0;width:90px;height:90px}
.btn.step{right:102px;bottom:4px;width:84px;height:84px;border-color:rgba(167,139,250,.9);color:#e2d8ff}
.btn.cut{right:12px;bottom:104px;width:64px;height:64px}
.btn.cut span{font-size:17px}
.btn.held{transform:scale(.9);background:rgba(124,58,237,.5)}
.btn.step.ready{background:rgba(124,58,237,.45);box-shadow:0 0 24px rgba(167,139,250,.8)}
.btn.cut.ready{background:rgba(233,182,92,.32);border-color:var(--gold);box-shadow:0 0 18px rgba(233,182,92,.6)}
.btn.hint::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2.5px solid var(--violet);animation:ring 1.1s infinite;pointer-events:none}
.btn.cut.hint::after{border-color:var(--gold)}
.btn.jump.hint::after{border-color:#f4ede2}
@keyframes ring{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.35);opacity:0}}
@media (pointer:fine){#controls{display:none}}
#obj{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translate(-50%,-6px);width:max-content;max-width:min(520px,calc(100vw - 32px));
  display:flex;align-items:center;gap:12px;background:rgba(14,9,22,.82);border:1px solid rgba(167,139,250,.45);border-radius:12px;padding:9px 16px 9px 10px;
  opacity:0;transition:opacity .3s,transform .3s,border-color .3s;pointer-events:none}
#obj.show{opacity:1;transform:translate(-50%,0)}
#obj.done{border-color:#86e3ad}
#obj .ic{flex:none;min-width:36px;height:34px;padding:0 9px;border-radius:8px;display:grid;place-items:center;font:700 13px var(--body);letter-spacing:.04em;
  background:rgba(167,139,250,.18);color:#e7defa;border:1px solid rgba(167,139,250,.6);white-space:nowrap}
#obj.done .ic{background:rgba(134,227,173,.2);border-color:#86e3ad;color:#c9f5da}
#obj p{margin:0;font-size:16px;line-height:1.3}
#toast{top:calc(122px + env(safe-area-inset-top,0px))}
@media (pointer:coarse){
  #toast{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:auto;max-width:max(240px,calc(100vw - 500px));padding:7px 12px 9px}
  #toast p{font-size:14px} #toast b{font-size:10px}
  #obj p{font-size:14px}
}
#hudR{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#mem{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
#mem i{width:10px;height:10px;transform:rotate(45deg);background:var(--violet);box-shadow:0 0 8px var(--violet)}
#mem.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.25)}}
#tm{opacity:.7;font-weight:400;margin-left:4px}
.sp-MEM b{color:var(--violet)} .sp-MEM p{font-style:italic}
@media (prefers-reduced-motion:reduce){#title .go{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Shadows of Kanchi, Chapter 1 playable slice"></canvas>
<div class="layer" id="hud"><div id="eye"><i></i><span id="eyeTxt">In the sun</span></div><div id="hudR"><div id="chap">I · The Coronation of Ash</div><div id="mem"><i></i><span id="memN">0/8</span><span id="tm">0:00</span></div></div></div>
<div id="obj"><span class="ic"></span><p></p></div>
<div id="toast"><b></b><p></p></div>
<div class="bar t"></div><div class="bar b"></div>
<div id="sub"><b></b><p></p><small></small></div>
<div class="layer" id="death"><p></p></div>
<div class="layer" id="credits">
  <div class="k">END OF CHAPTER I</div><h2>The Coronation of Ash</h2>
  <p id="stats"></p><p id="rank" class="n"></p><p class="n">Next: The Drowned Stepwell</p><p id="again" style="opacity:.6;font-size:14px"></p>
</div>
<div class="layer" id="title">
  <div class="k">VEL NADU · THE CORONATION MORNING</div>
  <h1>Shadows of Kanchi</h1>
  <div class="s">Chapter I · The Coronation of Ash</div>
  <div class="go" id="go">Tap to begin</div>
  <div class="keys" id="keys"></div>
</div>
<div class="layer" id="loading">CARVING KANCHI…</div>
<div id="err"></div>
<div id="controls">
  <div id="stickZone" class="idle"><div id="stickBase"><div id="stickKnob"></div></div><span id="stickHint">DRAG TO RUN</span></div>
  <div id="rpad">
    <button class="btn cut" data-k="cut" aria-label="Cut"><span>✕</span>CUT</button>
    <button class="btn step" data-k="step" aria-label="Shadow Step"><span>◆</span>STEP</button>
    <button class="btn jump" data-k="jump" aria-label="Jump"><span>▲</span>JUMP</button>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = id => document.getElementById(id);
const TOUCH = matchMedia('(pointer:coarse)').matches;
window.addEventListener('error', e => { const el = $('err'); el.style.display = 'block'; el.textContent = 'Something failed to load: ' + e.message; });

// =====================================================================
// Tuning. World units are metres. x runs along the lane, y is up, z points at the camera.
// =====================================================================
const RUN = 6.2, G = 26, JV = 9.0, STEP_R = 9.5, PH = 1.75, PHW = 0.25;
// Direction sunlight travels. Shadows lean +x and toward the camera (+z), so shade-casters sit behind the lane.
const SUN_D = new THREE.Vector3(0.32, -1, 0.35).normalize();
const TO_SUN = SUN_D.clone().negate();

// ---------- level (all solids are full-depth terraces; the lane is z = 0) ----------
const PL = [
  {x0:-16, x1:-6,  top:13, wall:1},
  {x0:-6,  x1:30,  top:0},
  {x0:10,  x1:13,  top:1.2, bottom:0, zf:1.6},
  {x0:14,  x1:17,  top:2.4, bottom:0, zf:1.6},
  {x0:33.2,x1:44,  top:0},
  {x0:50.5,x1:62,  top:0},
  {x0:66.6,x1:73,  top:0},
  {x0:77.6,x1:84,  top:0},
  {x0:88.6,x1:96,  top:1.0},
  {x0:103, x1:113, top:0},
  {x0:119.5,x1:127,top:0},
  {x0:133.5,x1:170,top:0},
  {x0:167.6,x1:170, top:0.43, bottom:0, zf:2.0},
  {x0:168.8,x1:170, top:0.86, bottom:0, zf:2.0},
  {x0:170, x1:190, top:1.3},
  {x0:190, x1:200, top:15, wall:1}
];
for (const p of PL){ p.bottom ??= p.top - 40; p.zf ??= 2.5; p.zb = -7.5; }
const ELEPHANTS = [{x:69.8, z:-1.4, top:0}, {x:80.8, z:-1.4, top:0}];
const LANE_STATUES = [ {x:90.0, z:-0.55, top:1.0, pose:'cheer'}, {x:90.42, z:-0.62, top:1.0, pose:'garland'}, {x:91.9, z:-0.55, top:1.0, pose:'drum'}, {x:92.32, z:-0.6, top:1.0, pose:'namaskaram'} ];
const BANNER = {x0:51.0, x1:54.0, y0:3.2, y1:5.6, z:-1.54};
const SWING = {px:105.2, py:9.5, L:3.5, A:0.65, T:3.4, w:2.6, h:2.0, z:-1.75, post0:103.3, post1:109.0};
const CANOPIES = [
  {post:112.3, x0:118.5, x1:124.5, y:3.4, z0:-3, z1:1, cut:0, t:0},
  {post:126.4, x0:132.5, x1:138.5, y:3.4, z0:-3, z1:1, cut:0, t:0}
];
const HALL = {x0:139, x1:165, y0:6.2, y1:7.0, z0:-7.5, z1:2.0};
const CHECKPOINTS = [
  {x:-999, sx:2, sy:0}, {x:33.5, sx:34.5, sy:0}, {x:50.6, sx:51.5, sy:0}, {x:66.8, sx:67.2, sy:0},
  {x:77.8, sx:78.2, sy:0}, {x:88.8, sx:89.2, sy:1.0}, {x:103.2, sx:103.8, sy:0}, {x:119.7, sx:120.3, sy:0},
  {x:133.7, sx:134.5, sy:0}, {x:170.2, sx:171, sy:1.3}
];
const K_ = (t, k) => TOUCH ? t : k;
const TRIGGERS = [
  {x:40,  lines:[['NIZHAL','Too far to jump. Not too far for me.']]},
  {x:63,  lines:[['VO','The temple elephants led the procession. Their bells stopped mid-swing.'],['NIZHAL','Big animals. Big shade.']]},
  {x:85,  lines:[['NIZHAL','Every shadow in Kanchi went somewhere. Mine just stayed.']]},
  {x:109, lines:[['NIZHAL','No shade out there.'],['ILAN','Then I\'ll make some.']]},
  {x:135, lines:[['VO','The feast was still laid out. Steam hung over the rice like glass.']]},
  {x:146, lines:[['NIZHAL','Ilan. The dark is moving.']], spawn:1},
  {x:168.5,lines:[['VO','They followed me to the doorway. The light took them there.']]}
];
// Guided tutorial: one objective at a time. Each stays on screen until the player does it.
// tk/kk = the button or key shown in the card on touch/keyboard. btn = which touch button pulses.
const OBJ = [
  {at:-99, tk:'◀ ▶', kk:'A D', text:K_('Drag anywhere on the left side of the screen to run.','Hold D or → to run.'), done:() => P.x > 6},
  {at:7, tk:'JUMP', kk:'Space', btn:'jump', text:'Jump onto the stone step.', done:() => P.ground && P.y > 1.1},
  {tk:'HOLD', kk:'Hold Space', btn:'jump', text:'Hold Jump to jump higher, onto the next step.', done:() => P.ground && P.y > 2.3},
  {at:22, tk:'JUMP', kk:'Space', btn:'jump', text:'Run and jump across the gap.', done:() => P.x > 33.4 && P.ground},
  {at:39, tk:'STEP', kk:'K', btn:'step', text:K_('Too far to jump. Tap Step to teleport into the shade where the violet ghost stands.','Too far to jump. Press K to Shadow Step into the shade where the violet ghost stands.'), done:() => P.x > 50.5 && P.ground},
  {tk:'i', kk:'i', text:'You can only Step into shade. A violet glow on the ground marks shade in reach.', info:5},
  {at:62, tk:'STEP', kk:'K', btn:'step', text:'Step from shade to shade under the elephants.', done:() => P.x > 77.6 && P.ground},
  {at:84, tk:'▲ + ◆', kk:'Space, K', btn:'step', text:'You can Step in mid-air. Jump first, then Step, to save a fall.', done:() => P.x > 88.6 && P.ground},
  {at:95.5, tk:'STEP', kk:'K', btn:'step', text:'The banner\'s shadow swings. Wait for the ghost, then Step.', done:() => P.x > 103 && P.ground},
  {at:108.5, tk:'CUT', kk:'J', btn:'cut', text:K_('No shade ahead. Stand by the rope post and tap Cut.','No shade ahead. Stand by the rope post and press J.'), done:() => !!CANOPIES[0].cut},
  {tk:'STEP', kk:'K', btn:'step', text:'The canopy made shade. Step into it.', done:() => P.x > 119.5 && P.ground},
  {tk:'CUT', kk:'J', btn:'cut', text:'Cut the next rope, then Step across.', done:() => P.x > 133.5 && P.ground},
  {at:146, tk:'CUT', kk:'J', btn:'cut', text:'Run! Cut knocks shadows back. Knock one into sunlight and it burns.', done:() => P.x > 167.3},
  {at:169, tk:'▶', kk:'D', text:'Go to the prince.', done:() => false}
];
// Shadow-memories: optional pickups. Several sit mid-air over gaps, so you grab them in a jump and Step to safety.
const MEMS = [
  {x:15.5, y:4.4, name:'Sengan, stone-carver', line:'He cut a crescent and a dot into every block he set.'},
  {x:31.6, y:2.3, name:'Malar, 9, flower-seller', line:'She was saving for a bronze bell.'},
  {x:61.4, y:0.95, name:'Veeran, guard captain', line:'He kept boys in the back row. He knew every one of their names.'},
  {x:75.2, y:2.4, name:'Ponni, bell-caster', line:'She cast the coronation bell. She never heard it ring.'},
  {x:94.6, y:3.3, name:'Arivu, star-reader', line:'She named a comet after her mother.'},
  {x:99.2, y:2.8, name:'Vel, water-carrier', line:'Three hundred steps a day, for forty years.'},
  {x:129.9, y:2.2, name:'Kannan, thavil drummer', line:'He played at nine coronations.'},
  {x:163.5, y:0.95, name:'Selvi, cook', line:'She made the payasam for the feast. It is still warm.'}
];
const DEATH_LINES = ['Wait. I\'m telling it wrong.', 'I\'d never fall for that.', 'Ask anyone. I didn\'t fall.', 'Let me tell that part again.'];

// Camera shots for cutscenes: [camera position, look-at point]
const INTRO = [
  {sp:'VO', t:'Most people remember Prince Aditya\'s coronation as an ordinary day.', cam:[9,1.2,17], look:[-4,34,-26]},
  {sp:'VO', t:'I\'m going to tell you what really happened.', cam:[6,1.6,12], look:[-4,30,-26]},
  {sp:'VO', t:'I opened Mayan\'s door. I lifted the Mirror. Then the minister struck it.', cam:[44,24,32], look:[30,-6,-18]},
  {sp:'VO', t:'Every shadow in Kanchi tore loose. The people turned to stone. The sun stopped at noon.', cam:[60,6,14], look:[70,1,-2]},
  {sp:'VO', t:'I woke on the temple steps with a shard in my armband.', cam:[6.2,1.6,6.0], look:[2,0.4,0], wake:0},
  {sp:'NIZHAL', t:'Well. You\'ve really done it this time.', cam:[5.6,1.6,5.4], look:[1.2,0.8,-0.4], wake:1},
  {sp:'ILAN', t:'...Who said that?', cam:[5.4,2.0,5.2], look:[1.8,1.4,0], wake:2},
  {sp:'NIZHAL', t:'Your shadow. Keep up. The palace is coming down.', cam:[6.0,2.1,6.2], look:[1.4,1.3,-0.3], wake:2}
];
const ENDING = [
  {sp:'VO', t:'Aditya stood where the priests had left him, the crown half-raised.', cam:[172.4,3.8,7.0], look:[178.0,2.8,-1.2]},
  {sp:'VO', t:'We climbed the same walls as boys. He never once looked down on me.', cam:[175.2,3.4,5.2], look:[178.4,3.1,-1.2]},
  {sp:'NIZHAL', t:'Nobody saw it was you. You could just walk away.', cam:[175.6,2.9,5.6], look:[175.4,2.3,-0.4]},
  {sp:'ILAN', t:'I could have.', cam:[178.6,3.0,5.4], look:[176.4,2.7,0]},
  {sp:'VO', t:'I didn\'t.', cam:[171,8,15], look:[178,2,-2]}
];

// =====================================================================
// Renderer, scene, post
// =====================================================================
const canvas = $('c');

// Final grade: violet-lifted shadows, warm highlights, vignette, fine grain.
const grade = new ShaderPass({
  uniforms:{tDiffuse:{value:null}, time:{value:0}, vig:{value:0.32}},
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform sampler2D tDiffuse; uniform float time, vig; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233))+time*7.0)*43758.5453); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      float l = dot(c, vec3(.2126,.7152,.0722));
      c += vec3(.035,.01,.07) * (1.-smoothstep(0.,.45,l));      // violet in the shadows
      c *= mix(vec3(1.), vec3(1.04,1.0,.94), smoothstep(.4,1.,l)); // warm highlights
      c = mix(vec3(l), c, 1.06);
      vec2 d = vUv-.5; c *= 1. - vig*dot(d,d)*2.2;
      c += (h(vUv*1000.)-.5)*.025;
      gl_FragColor = vec4(c,1.);
    }`
});

const skyMat = new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{ sunDir:{value:TO_SUN.clone()}, time:{value:0} },
  vertexShader:`varying vec3 vDir; void main(){ vDir = normalize(position); vec4 p = projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position = p.xyww; }`,
  fragmentShader:`uniform vec3 sunDir; uniform float time; varying vec3 vDir;
    float hash(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
    float noise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
      return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
    void main(){
      vec3 d = normalize(vDir); float e = d.y;
      vec3 hor = vec3(1.0,.70,.45), mid = vec3(.80,.43,.33), zen = vec3(.25,.17,.38), gnd = vec3(.42,.26,.2);
      vec3 c = mix(hor, mid, smoothstep(.0,.22,e));
      c = mix(c, zen, smoothstep(.2,.85,e));
      c = mix(c, gnd, smoothstep(.0,-.12,e));
      float s = max(dot(d, sunDir), 0.);
      c += vec3(1.,.78,.5)*pow(s,6.)*.45 + vec3(1.,.9,.7)*pow(s,64.)*.8;
      c += vec3(1.,.96,.88)*smoothstep(.99955,.9998,s)*28.;
      // thin high cloud, lit warm
      vec2 q = d.xz/(e+.18);
      float n = noise(vec3(q*vec2(.55,2.2),1.)) *.6 + noise(vec3(q*vec2(1.3,5.),3.))*.4;
      float cl = smoothstep(.55,.85,n) * smoothstep(.02,.25,e) * (1.-smoothstep(.5,.9,e));
      c = mix(c, vec3(1.,.82,.66)*(.9+.4*pow(s,4.)), cl*.45);
      gl_FragColor = vec4(c*.95, 1.);
    }`
});

// =====================================================================
// Procedural texture generation (tileable value noise, height → normal maps)
// =====================================================================
function hash2(x, y, s){ let h = (x*374761393 + y*668265263 + s*1442695041) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function vn(x, y, s, P){ const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf), m = k => ((k % P) + P) % P;
  const a = hash2(m(xi),m(yi),s), b = hash2(m(xi+1),m(yi),s), c = hash2(m(xi),m(yi+1),s), d = hash2(m(xi+1),m(yi+1),s);
  return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v; }
function fbm(x, y, s, P, oct=4){ let f = 0, a = .5, fr = 1; for (let i = 0; i < oct; i++){ f += a*vn(x*fr, y*fr, s+i, P*fr); fr *= 2; a *= .5; } return f; }
const sstep = (a, b, x) => { const t = Math.max(0, Math.min(1, (x-a)/(b-a))); return t*t*(3-2*t); };
let rngS = 7; const rnd = () => (rngS = (rngS*16807) % 2147483647) / 2147483647;

function pixelTextures(N, fn, normalStrength=2.5){
  const alb = new Uint8ClampedArray(N*N*4), rgh = new Uint8ClampedArray(N*N*4), H = new Float32Array(N*N), nor = new Uint8ClampedArray(N*N*4);
  const o = {r:0,g:0,b:0,h:0,ro:0};
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    fn(x, y, o); const i = y*N + x;
    alb[i*4] = o.r; alb[i*4+1] = o.g; alb[i*4+2] = o.b; alb[i*4+3] = 255;
    const r = o.ro*255; rgh[i*4] = r; rgh[i*4+1] = r; rgh[i*4+2] = r; rgh[i*4+3] = 255; H[i] = o.h;
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const i = y*N + x, l = H[y*N + (x-1+N)%N], rr = H[y*N + (x+1)%N], u = H[((y-1+N)%N)*N + x], d = H[((y+1)%N)*N + x];
    let nx = -(rr - l)*normalStrength, ny = (d - u)*normalStrength, nz = 1; const L = Math.hypot(nx, ny, nz);
    nor[i*4] = (nx/L*.5+.5)*255; nor[i*4+1] = (ny/L*.5+.5)*255; nor[i*4+2] = (nz/L*.5+.5)*255; nor[i*4+3] = 255;
  }
  const mk = (data, srgb) => { const c = document.createElement('canvas'); c.width = c.height = N; c.getContext('2d').putImageData(new ImageData(data, N, N), 0, 0);
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = ANISO; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
  return {map:mk(alb, true), roughnessMap:mk(rgh, false), normalMap:mk(nor, false)};
}
function canvasTexture(w, h, draw, srgb=true){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = ANISO; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t;
}

// Ashlar masonry: 8 courses per 4 m tile, granite and sandstone blocks, weathering streaks, chipped arrises.
function masonryTex(palette, seed, N=512){
  rngS = seed; const rows = [];
  for (let r = 0; r < 8; r++){ const br = []; let x = Math.floor(rnd()*80); const start = x;
    while (x < start + N - 50){ br.push(x % N); x += 46 + Math.floor(rnd()*58); } rows.push({br:br.sort((a,b)=>a-b), tint:[]}); }
  for (const row of rows) for (let i = 0; i < row.br.length; i++){ const k = 0.93 + rnd()*0.12; row.tint.push(palette[Math.floor(rnd()*palette.length)].map(v => v*k)); }
  return pixelTextures(N, (x, y, o) => {
    const row = rows[y >> 6], ry = y & 63, br = row.br;
    let bi = br.length - 1; for (let i = 0; i < br.length; i++) if (br[i] <= x) bi = i;
    if (x < br[0]) bi = br.length - 1;
    const b0 = br[bi], b1 = br[(bi+1) % br.length];
    const dl = (x - b0 + N) % N, dr = (b1 - x + N) % N;
    const ex = Math.min(dl, dr), ey = Math.min(ry, 63 - ry), edge = Math.min(ex, ey);
    const fine = fbm(x/9, y/9, seed, N/9, 3), big = fbm(x/70, y/70, seed+9, N/70, 3);
    const chip = edge < 7 && fbm(x/4, y/4, seed+3, N/4, 2) > 0.62 ? 0.45 : 0;
    const joint = edge < 2.2;
    const streak = fbm(x/6, y/120, seed+5, N/6, 3);
    const t = row.tint[bi];
    let k = (0.78 + 0.34*fine) * (0.86 + 0.28*big) * (1 - 0.22*streak*sstep(10, 64, ry)) * (1 - 0.18*sstep(4, 0, ey));
    if (hash2(x, y, seed) > 0.988) k *= 0.6;
    if (hash2(x+7, y, seed) > 0.993) k *= 1.25;
    if (joint){ o.r = 74; o.g = 62; o.b = 56; o.h = 0; o.ro = 0.97; return; }
    o.r = t[0]*k; o.g = t[1]*k; o.b = t[2]*k;
    o.h = sstep(0, 6, edge) * (0.82 + 0.18*fine) - chip;
    o.ro = 0.78 + 0.16*fine + chip*0.2;
  }, 3.2);
}
// Flagstone paving for terrace tops: large slabs, worn smooth where feet passed.
function flagTex(seed, N=512){
  rngS = seed; const rows = [];
  for (let r = 0; r < 4; r++){ const br = []; let x = Math.floor(rnd()*100); const s0 = x;
    while (x < s0 + N - 80){ br.push(x % N); x += 96 + Math.floor(rnd()*80); } rows.push({br:br.sort((a,b)=>a-b), t:br.map(() => 0.9 + rnd()*0.2)}); }
  return pixelTextures(N, (x, y, o) => {
    const row = rows[y >> 7], ry = y & 127, br = row.br;
    let bi = br.length - 1; for (let i = 0; i < br.length; i++) if (br[i] <= x) bi = i; if (x < br[0]) bi = br.length - 1;
    const dl = (x - br[bi] + N) % N, dr = (br[(bi+1) % br.length] - x + N) % N;
    const edge = Math.min(dl, dr, ry, 127 - ry);
    const fine = fbm(x/7, y/7, seed, N/7, 3), big = fbm(x/90, y/90, seed+4, N/90, 3), stain = fbm(x/40, y/40, seed+8, N/40, 3);
    let k = row.t[bi] * (0.8 + 0.3*fine) * (0.85 + 0.3*big) * (1 - 0.25*sstep(.55, .8, stain));
    if (hash2(x, y, seed+1) > 0.985) k *= 0.7;
    if (edge < 1.8){ o.r = 82; o.g = 66; o.b = 58; o.h = 0; o.ro = .95; return; }
    o.r = 196*k; o.g = 160*k; o.b = 128*k;
    o.h = sstep(0, 5, edge) * (0.9 + 0.1*fine);
    o.ro = 0.62 + 0.25*fine + 0.1*sstep(.55, .8, stain);
  }, 2.6);
}
// Fine-grained pink granite for statues (people and animals turned to stone).
function graniteTex(seed, base, N=256){
  return pixelTextures(N, (x, y, o) => {
    const f = fbm(x/5, y/5, seed, N/5, 3), b = fbm(x/40, y/40, seed+3, N/40, 3);
    let k = (0.84 + 0.22*f) * (0.9 + 0.2*b);
    const s = hash2(x, y, seed);
    if (s > 0.94) k *= 0.55; else if (s > 0.9) k *= 1.22;
    o.r = base[0]*k; o.g = base[1]*k; o.b = base[2]*k; o.h = f*.6 + b*.4; o.ro = 0.72 + 0.2*f;
  }, 1.6);
}
function woodTex(seed, N=256){
  return pixelTextures(N, (x, y, o) => {
    const g = fbm(x/3, y/60, seed, N/3, 4), r = Math.sin((x + g*40)/3.2)*.5 + .5;
    const k = 0.7 + 0.25*r + 0.1*fbm(x/20, y/20, seed+2, N/20, 2);
    o.r = 104*k; o.g = 70*k; o.b = 46*k; o.h = r*.5 + g*.5; o.ro = 0.7 + 0.2*g;
  }, 1.5);
}
function earthTex(seed, N=256){
  return pixelTextures(N, (x, y, o) => {
    const f = fbm(x/12, y/12, seed, N/12, 4), p = hash2(x, y, seed) > .97 ? .8 : 1;
    o.r = 168*(.8+.3*f)*p; o.g = 124*(.8+.3*f)*p; o.b = 88*(.8+.3*f)*p; o.h = f; o.ro = .95;
  }, 1.2);
}

    g.bezierCurveTo(118, -72, 140, -62, 142, -44); g.bezierCurveTo(146, -30, 132, -18, 120, -16);
    g.lineTo(110, 10); g.lineTo(122, 64); g.lineTo(104, 66); g.lineTo(92, 20); g.lineTo(60, 18); g.lineTo(70, 66); g.lineTo(52, 68); g.lineTo(38, 22);
    g.bezierCurveTo(0, 26, -40, 26, -70, 22); g.lineTo(-62, 66); g.lineTo(-80, 68); g.lineTo(-92, 24); g.lineTo(-104, 64); g.lineTo(-122, 64);
    g.bezierCurveTo(-120, 40, -126, 24, -120, 10); g.closePath(); g.fill(); g.stroke();

}

const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
function place(g, x, y, z, rx=0, ry=0, rz=0, sx=1, sy=1, sz=1){
  const m = new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new THREE.Vector3(sx, sy, sz));
  return g.clone().applyMatrix4(m);
}
const merge = list => mergeGeometries(list.map(g => g.index ? g.toNonIndexed() : g), false);
// UVs in metres so stone texture scale is the same on every face (tile = metres per texture repeat).
function worldUV(g, tile){
  g.computeBoundingBox(); const pos = g.attributes.position, nor = g.attributes.normal, uv = g.attributes.uv;
  for (let i = 0; i < pos.count; i++){
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i), ax = Math.abs(nor.getX(i)), ay = Math.abs(nor.getY(i)), az = Math.abs(nor.getZ(i));
    if (ay >= ax && ay >= az) uv.setXY(i, x/tile, z/tile); else if (ax >= az) uv.setXY(i, z/tile, y/tile); else uv.setXY(i, x/tile, y/tile);
  }
  uv.needsUpdate = true; return g;
}
function lathe(profile, seg=24){ return new THREE.LatheGeometry(profile.map(([r, y]) => new THREE.Vector2(r, y)), seg); }

// Materials (filled in after textures are generated)

const MAT = {};
function buildMaterials(){
  const mas = masonryTex([[152,136,122],[144,130,118],[160,144,128],[138,126,116],[150,134,120]], 11);
  const masDark = masonryTex([[70,62,74],[62,56,66],[80,70,82],[56,50,60]], 23);
  const flag = flagTex(5);
  const gran = graniteTex(3, [166,152,140]);
  const wood = woodTex(4), earth = earthTex(9);
  const S = (t, rep, opts={}) => { for (const k of ['map','normalMap','roughnessMap']) if (t[k]){ t[k] = t[k].clone(); t[k].repeat.set(rep, rep); t[k].needsUpdate = true; }
    return new THREE.MeshStandardMaterial(Object.assign({map:t.map, normalMap:t.normalMap, roughnessMap:t.roughnessMap, roughness:1, metalness:0, envMapIntensity:.5}, opts)); };
  MAT.mason = S(mas, 1);
  MAT.flag = S(flag, 1);
  MAT.dark = S(masDark, 1, {envMapIntensity:.9});
  MAT.stone = S(gran, 1, {normalScale:new THREE.Vector2(.6,.6)});
  MAT.stoneBig = S(gran, 1);
  MAT.wood = S(wood, 1);
  MAT.earth = S(earth, 1);
  MAT.gold = new THREE.MeshStandardMaterial({color:0xd9a441, metalness:1, roughness:.28, envMapIntensity:1.4});
  MAT.bronze = new THREE.MeshStandardMaterial({color:0xa86a3a, metalness:1, roughness:.38, envMapIntensity:1.2});
  MAT.brass = new THREE.MeshStandardMaterial({color:0xc99a48, metalness:1, roughness:.32, envMapIntensity:1.2});
  MAT.skin = new THREE.MeshPhysicalMaterial({color:0x8a5536, roughness:.52, sheen:.5, sheenColor:new THREE.Color(0xd08a60), sheenRoughness:.6});
  MAT.cotton = new THREE.MeshStandardMaterial({color:0xe9dcc2, roughness:.92});
  MAT.sash = new THREE.MeshPhysicalMaterial({color:0xa3201d, roughness:.6, sheen:1, sheenColor:new THREE.Color(0xff6a4a), sheenRoughness:.4});

// Adhishthana: the moulded plinth of a Dravidian temple, extruded along the terrace front.
function plinthGeometry(len){
  const s = new THREE.Shape();
  const P = [[0,0],[0.22,0],[0.22,0.3],[0.12,0.3],[0.12,0.62],[0.18,0.66],[0.18,0.7]];
  s.moveTo(0, 0);
  for (const [z, y] of P) s.lineTo(z, y);
  for (let i = 0; i <= 8; i++){ const a = -Math.PI/2 + i/8*Math.PI; s.lineTo(0.06 + Math.cos(a)*0.2, 0.92 + Math.sin(a)*0.22); } // kumuda (round torus moulding)
  for (const [z, y] of [[0.04,1.14],[0.04,1.32],[0.16,1.34],[0.16,1.52],[0.06,1.54],[0.06,1.62],[0.2,1.64],[0.2,1.74],[0,1.74]]) s.lineTo(z, y);
  s.lineTo(0, 0);
  const g = new THREE.ExtrudeGeometry(s, {depth:len, bevelEnabled:false, curveSegments:4});
  g.rotateY(-Math.PI/2);  // extrusion runs along x; the profile projects toward +z
  g.translate(len, 0, 0);
  worldUV(g, 2.5);
  return g;
}
function buildTerraces(){
  const group = new THREE.Group();
  for (const p of PL){
    const w = p.x1 - p.x0, h = p.top - p.bottom, d = p.zf - p.zb;
    const g = box(w, h, d); g.translate(p.x0 + w/2, p.bottom + h/2, p.zb + d/2); worldUV(g, 6.5);
    // top face uses flagstones, the rest masonry
    const mats = [MAT.mason, MAT.mason, MAT.flag, MAT.mason, MAT.mason, MAT.mason];
    const m = new THREE.Mesh(g, p.wall ? MAT.dark : mats); m.castShadow = m.receiveShadow = true; group.add(m);
    if (!p.wall){
      const pl = plinthGeometry(w); pl.translate(p.x0, p.top - 1.78, p.zf);
      const pm = new THREE.Mesh(pl, MAT.stoneBig); pm.castShadow = pm.receiveShadow = true; group.add(pm);
      // coping stones with a small overhang
      const c = box(w + 0.06, 0.12, 0.3); c.translate(p.x0 + w/2, p.top - 0.06, p.zf + 0.1); worldUV(c, 4);
      const cm = new THREE.Mesh(c, MAT.flag); cm.receiveShadow = true; group.add(cm);
    }
  }
  scene.add(group);
}
// A Dravidian vimana: stepped tiers ringed with miniature shrines (kutas at corners, salas between), octagonal crown, gold finial.
function vimanaGeometry(W, tiers, opt={}){
  const parts = [], gold = [];
  const baseH = W*0.42;
  let g = box(W, baseH, W); g.translate(0, baseH/2, 0); parts.push(g);
  for (let i = 0; i < 6; i++){ const t = -W/2 + (i+0.5)*W/6; for (const s of [-1,1]){
    parts.push(place(box(W*0.05, baseH*0.9, 0.12), t, baseH*0.45, s*W/2)); parts.push(place(box(0.12, baseH*0.9, W*0.05), s*W/2, baseH*0.45, t)); } }
  parts.push(place(box(W*1.08, W*0.04, W*1.08), 0, baseH, 0));
  let y = baseH, s = W;
  const k = opt.taper ?? 0.62;
  for (let i = 0; i < tiers; i++){
    const s2 = W*(1 - (i+1)/(tiers + 1)*k), th = W*(opt.tierH ?? 0.2)*(1 - i*0.02);
    parts.push(place(box(s2, th*0.62, s2), 0, y + th*0.31, 0));
    parts.push(place(box(s2*1.06, th*0.06, s2*1.06), 0, y + th*0.62, 0));
    const c = (s - s2)/2*0.9 + 0.05, ky = y + c*0.35;
    for (const sx of [-1,1]) for (const sz of [-1,1]){
      parts.push(place(box(c, c*0.7, c), sx*(s/2 - c/2), ky, sz*(s/2 - c/2)));
      parts.push(place(new THREE.SphereGeometry(c*0.52, 8, 5, 0, Math.PI*2, 0, Math.PI/2), sx*(s/2 - c/2), ky + c*0.35, sz*(s/2 - c/2), 0, Math.PI/4, 0, 1, 0.9, 1));
    }
    const nS = Math.max(1, Math.round((s - 2*c)/(c*2.2)));
    for (let j = 0; j < nS; j++){ const t = -s/2 + c + (j + 0.5)*(s - 2*c)/nS;
      for (const sd of [-1,1]){
        parts.push(place(box(c*1.4, c*0.62, c*0.9), t, ky, sd*(s/2 - c*0.45)));
        parts.push(place(new THREE.CylinderGeometry(c*0.45, c*0.45, c*1.4, 8, 1, false, 0, Math.PI), t, ky + c*0.31, sd*(s/2 - c*0.45), 0, 0, Math.PI/2));
        parts.push(place(box(c*0.9, c*0.62, c*1.4), sd*(s/2 - c*0.45), ky, t));
        parts.push(place(new THREE.CylinderGeometry(c*0.45, c*0.45, c*1.4, 8, 1, false, 0, Math.PI), sd*(s/2 - c*0.45), ky + c*0.31, t, Math.PI/2, 0, Math.PI/2));
      }
    }
    y += th; s = s2;
  }
  parts.push(place(new THREE.CylinderGeometry(s*0.34, s*0.38, s*0.3, 8), 0, y + s*0.15, 0));
  const dome = lathe([[0,0],[s*0.52,0],[s*0.58,s*0.08],[s*0.56,s*0.2],[s*0.46,s*0.34],[s*0.28,s*0.44],[0.02,s*0.5]], 8);
  dome.rotateY(Math.PI/8); dome.translate(0, y + s*0.3, 0); parts.push(dome);
  const st = lathe([[0,0],[s*0.09,0],[s*0.12,s*0.06],[s*0.05,s*0.13],[s*0.07,s*0.17],[0.01,s*0.3]], 12);
  st.translate(0, y + s*0.8, 0); gold.push(st);
  const geo = merge(parts); worldUV(geo, 4);
  return {stone:geo, gold:merge(gold), height:y + s*1.1};
}
// Gopuram: oblong gateway tower capped by a barrel vault and a row of kalashas.
function gopuramGeometry(W, D, tiers){
  const parts = [], gold = [];
  let y = 0, w = W, d = D;
  parts.push(place(box(W, W*0.35, D), 0, W*0.175, 0)); y = W*0.35;
  for (let i = 0; i < tiers; i++){
    const w2 = w*0.9, d2 = d*0.82, th = W*0.13;
    parts.push(place(box(w2, th*0.7, d2), 0, y + th*0.35, 0));
    parts.push(place(box(w2*1.05, th*0.07, d2*1.08), 0, y + th*0.7, 0));
    for (let j = 0; j < 7; j++){ const t = -w2/2 + (j + 0.5)*w2/7; parts.push(place(box(w2/12, th*0.5, 0.2), t, y + th*0.3, d2/2)); parts.push(place(box(w2/12, th*0.5, 0.2), t, y + th*0.3, -d2/2)); }
    y += th; w = w2; d = d2;
  }
  parts.push(place(new THREE.CylinderGeometry(d*0.55, d*0.55, w, 12, 1, false, 0, Math.PI), 0, y, 0, 0, 0, Math.PI/2));
  for (let j = 0; j < 7; j++){ const t = -w/2*0.85 + j*(w*0.85)/6;
    const k = lathe([[0,0],[d*0.08,0],[d*0.11,d*0.06],[d*0.04,d*0.12],[0.01,d*0.25]], 10); k.translate(t, y + d*0.5, 0); gold.push(k); }
  const geo = merge(parts); worldUV(geo, 4);
  return {stone:geo, gold:merge(gold)};
}
// Chola pillar: square base, alternating square and octagonal shaft, lotus capital, abacus and corbel brackets.
function pillarGeometry(H){
  const p = [];
  p.push(place(box(0.7, 0.5, 0.7), 0, 0.25, 0));
  let y = 0.5; const seg = (H - 1.6)/5;
  for (let i = 0; i < 5; i++){
    if (i % 2 === 0) p.push(place(box(0.5, seg, 0.5), 0, y + seg/2, 0));
    else p.push(place(new THREE.CylinderGeometry(0.24, 0.24, seg, 8), 0, y + seg/2, 0, 0, Math.PI/8, 0));
    p.push(place(box(0.54, 0.06, 0.54), 0, y + seg, 0));
    y += seg;
  }
  const cap = lathe([[0.2,0],[0.3,0.12],[0.34,0.26],[0.26,0.4],[0.36,0.48],[0.0,0.48]], 16); cap.translate(0, y, 0); p.push(cap); y += 0.48;
  p.push(place(box(0.8, 0.12, 0.8), 0, y + 0.06, 0)); y += 0.12;
  for (const r of [0, Math.PI/2]){ const b = box(1.5, 0.3, 0.32); p.push(place(b, 0, y + 0.15, 0, 0, r, 0));
    for (const sx of [-1,1]) p.push(place(new THREE.CylinderGeometry(0.15, 0.15, 0.32, 10), sx*0.62*(r ? 0 : 1), y + 0.02, sx*0.62*(r ? 1 : 0), Math.PI/2, r, 0)); }
  y += 0.3;
  p.push(place(box(0.4, H - y, 0.4), 0, y + (H - y)/2, 0));
  const g = merge(p); worldUV(g, 2); return g;
}

// People: a jointed figure built from rounded primitives. Baked to one mesh for statues.

let LO = false; // low-detail figures for distant crowds
function cap(r, len){ return new THREE.CapsuleGeometry(r, len, LO ? 2 : 4, LO ? 6 : 10); }
function sph(r, w=12, h=8, ...rest){ return new THREE.SphereGeometry(r, LO ? Math.max(6, w >> 1) : w, LO ? Math.max(4, h >> 1) : h, ...rest); }
function makeRig(mats, opt={}){
  const M = mats.skin ? mats : {skin:mats, cloth:mats, sash:mats, hair:mats, metal:mats, eye:mats.eye};
  const add = (parent, geo, mat, x=0, y=0, z=0, sx=1, sy=1, sz=1) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; };
  const grp = (parent, x=0, y=0, z=0) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };
  const root = new THREE.Group(), tilt = grp(root), pelvis = grp(tilt, 0, 0.95, 0), spine = grp(pelvis, 0, 0.02, 0);
  // torso: abdomen, ribcage, pectoral plane, shoulder caps
  add(spine, cap(0.125, 0.14), M.skin, 0, 0.13, 0.0, 1.15, 1, 0.82);
  add(spine, cap(0.155, 0.16), M.skin, 0, 0.36, -0.005, 1.32, 1, 0.84);
  add(spine, sph(0.1, 12, 8), M.skin, 0.07, 0.42, 0.045, 1, 0.6, 0.38);
  add(spine, sph(0.1, 12, 8), M.skin, -0.07, 0.42, 0.045, 1, 0.6, 0.38);
  const neck = grp(spine, 0, 0.53, 0); add(neck, new THREE.CylinderGeometry(0.052, 0.06, 0.12, 10), M.skin, 0, 0.04, 0);
  const head = grp(neck, 0, 0.1, 0.005);
  add(head, sph(0.1, 18, 14), M.skin, 0, 0.1, 0, 0.88, 1.12, 1);
  add(head, sph(0.06, 12, 8), M.skin, 0, 0.035, 0.035, 1.05, 0.8, 1);            // jaw
  add(head, box(0.025, 0.05, 0.04), M.skin, 0, 0.09, 0.1);                                              // nose
  add(head, sph(0.104, 16, 10, 0, Math.PI*2, 0, Math.PI*0.55), M.hair, 0, 0.115, -0.012, 0.9, 1.08, 1.02);
  add(head, sph(0.058, 12, 10), M.hair, 0.0, 0.215, -0.045);                      // topknot (kondai)
  if (M.eye){ add(head, sph(0.014, 8, 6), M.eye, 0.035, 0.115, 0.088); add(head, sph(0.014, 8, 6), M.eye, -0.035, 0.115, 0.088); }
  if (opt.earrings) for (const s of [-1,1]) add(head, new THREE.TorusGeometry(0.018, 0.005, 6, 12), M.metal, s*0.088, 0.07, 0);
  const sh = [], el = [], hip = [], kn = [];
  for (const s of [-1, 1]){
    const S = grp(spine, s*0.205, 0.45, -0.005); sh.push(S);
    add(S, sph(0.07, 10, 8), M.skin, 0, 0, 0);
    add(S, cap(0.052, 0.2), M.skin, 0, -0.15, 0);
    const E = grp(S, 0, -0.3, 0); el.push(E);
    add(E, cap(0.043, 0.18), M.skin, 0, -0.13, 0);
    add(E, sph(0.048, 10, 8), M.skin, 0, -0.29, 0.01, 0.7, 1.15, 0.9);
    if (opt.armband && s === 1){ add(S, new THREE.TorusGeometry(0.058, 0.014, 8, 20), M.metal, 0, -0.11, 0, 1, 1, 1).rotation.x = Math.PI/2;
      const sh2 = add(S, new THREE.OctahedronGeometry(0.03), opt.shardMat, 0.02, -0.11, 0.055, 1, 1.6, 1); sh2.castShadow = false; }
    const Hh = grp(pelvis, s*0.095, -0.02, 0); hip.push(Hh);
    add(Hh, cap(0.078, 0.3), M.cloth, 0, -0.22, 0);
    const K = grp(Hh, 0, -0.45, 0); kn.push(K);
    add(K, cap(0.056, 0.3), M.skin, 0, -0.2, 0);
    add(K, box(0.085, 0.06, 0.22), M.skin, 0, -0.43, 0.05);
  }
  // veshti tied as kacham (tucked for movement), and the red waist sash
  add(pelvis, new THREE.CylinderGeometry(0.155, 0.175, 0.24, 16), M.cloth, 0, -0.04, 0);
  if (opt.sash){ add(pelvis, new THREE.TorusGeometry(0.165, 0.036, 8, 24), M.sash, 0, 0.06, 0, 1, 1, 0.82).rotation.x = Math.PI/2;
    const tail = add(pelvis, box(0.07, 0.34, 0.02), M.sash, -0.08, -0.12, 0.15); tail.rotation.z = 0.12; }
  let sword = null;
  if (opt.sword){ sword = new THREE.Group(); const blade = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.012, 4, 20, 1.1), MAT.bronze);
    blade.rotation.z = -0.4; blade.position.set(0.32, -0.18, 0); sword.add(blade); el[1].add(sword); sword.position.set(0, -0.3, 0); sword.visible = false; }
  const rig = {root, tilt, pelvis, spine, neck, head, sh, el, hip, kn, sword, phase:0};
  return rig;
}
// Pose library. Angles in radians. +x rotation on a hip swings the leg back.
function poseRig(r, p){
  const set = (o, x=0, y=0, z=0) => o.rotation.set(x, y, z);
  const t = p.t || 0;
  r.pelvis.position.y = 0.95; set(r.spine, 0.04); set(r.neck); set(r.head);
  if (p.name === 'run'){
    const ph = p.phase, sw = Math.sin(ph);
    set(r.hip[0], sw*0.75); set(r.hip[1], -sw*0.75);
    set(r.kn[0], 0.25 + Math.max(0, Math.cos(ph))*1.15); set(r.kn[1], 0.25 + Math.max(0, -Math.cos(ph))*1.15);
    set(r.sh[0], -sw*0.7, 0, -0.1); set(r.sh[1], sw*0.7, 0, 0.1);
    set(r.el[0], -0.9); set(r.el[1], -0.9);
    set(r.spine, 0.16, 0, 0); r.pelvis.position.y = 0.92 + Math.abs(Math.cos(ph))*0.05;
  } else if (p.name === 'air'){
    set(r.hip[0], -0.9); set(r.hip[1], 0.3); set(r.kn[0], 1.2); set(r.kn[1], 0.8);
    set(r.sh[0], -1.4, 0, -0.4); set(r.sh[1], 0.5, 0, 0.5); set(r.el[0], -0.6); set(r.el[1], -0.5); set(r.spine, 0.1);
  } else if (p.name === 'idle'){
    const b = Math.sin(t*1.6)*0.015;
    set(r.hip[0], 0.02, 0, -0.03); set(r.hip[1], -0.04, 0, 0.03); set(r.kn[0], 0.06); set(r.kn[1], 0.1);
    set(r.sh[0], 0.04, 0, -0.12 - b); set(r.sh[1], -0.02, 0, 0.12 + b); set(r.el[0], -0.15); set(r.el[1], -0.2);
    r.spine.rotation.x = 0.02 + b;
  } else if (p.name === 'cheer'){
    set(r.hip[0], -0.05, 0, -0.06); set(r.hip[1], 0.2, 0, 0.04); set(r.kn[0], 0.05); set(r.kn[1], 0.3);
    set(r.sh[0], -0.2, 0, -2.5); set(r.sh[1], -0.3, 0, 2.7); set(r.el[0], -0.4); set(r.el[1], -0.3); set(r.spine, -0.08); set(r.head, -0.25);
  } else if (p.name === 'drum'){
    set(r.hip[0], -0.1, 0, -0.1); set(r.hip[1], 0.1, 0, 0.1); set(r.kn[0], 0.2); set(r.kn[1], 0.2);
    set(r.sh[0], -0.9, 0, -0.5); set(r.sh[1], -1.6, 0, 0.3); set(r.el[0], -1.3); set(r.el[1], -0.7); set(r.spine, 0.08);
  } else if (p.name === 'namaskaram'){
    set(r.sh[0], -0.9, 0, 0.25); set(r.sh[1], -0.9, 0, -0.25); set(r.el[0], -1.6, 0.6); set(r.el[1], -1.6, -0.6); set(r.head, 0.2); set(r.spine, 0.12);
    set(r.hip[0]); set(r.hip[1]); set(r.kn[0]); set(r.kn[1]);
  } else if (p.name === 'garland'){
    set(r.hip[0], -0.4); set(r.hip[1], 0.25); set(r.kn[0], 0.3); set(r.kn[1], 0.5);
    set(r.sh[0], -0.4, 0, -0.3); set(r.sh[1], -2.3, 0, 0.6); set(r.el[0], -0.6); set(r.el[1], -0.3); set(r.spine, 0.05);
  } else if (p.name === 'crown'){
    set(r.hip[0], 0, 0, -0.05); set(r.hip[1], 0, 0, 0.05); set(r.kn[0]); set(r.kn[1]);
    set(r.sh[0], -2.75, 0, -0.18); set(r.sh[1], -2.75, 0, 0.18); set(r.el[0], -0.45); set(r.el[1], -0.45); set(r.head, -0.12);
  } else if (p.name === 'hunch'){
    const ph = p.phase || 0, sw = Math.sin(ph)*(p.moving ? 0.45 : 0.06);
    set(r.hip[0], sw - 0.2); set(r.hip[1], -sw - 0.2); set(r.kn[0], 0.5 + Math.max(0, Math.cos(ph))*0.5); set(r.kn[1], 0.5 + Math.max(0, -Math.cos(ph))*0.5);
    set(r.spine, 0.55); set(r.head, -0.45);
    set(r.sh[0], -0.9 + sw, 0, -0.35); set(r.sh[1], -0.9 - sw, 0, 0.35); set(r.el[0], -0.5); set(r.el[1], -0.5);
    r.pelvis.position.y = 0.82;
  }
  if (p.atk){ set(r.sh[1], -1.9 + (1 - p.atk/0.22)*2.4, 0, 0.3); set(r.el[1], -0.2); }
}
// Bake a posed rig (or any group) into one geometry per material, then wrap as meshes.
function bake(group){
  group.updateMatrixWorld(true);
  const byMat = new Map();
  group.traverse(o => { if (o.isMesh){ const g = o.geometry.clone().applyMatrix4(o.matrixWorld); const k = o.material; if (!byMat.has(k)) byMat.set(k, []); byMat.get(k).push(g); } });
  const out = new THREE.Group();
  for (const [m, gs] of byMat){ const mesh = new THREE.Mesh(merge(gs), m); mesh.castShadow = mesh.receiveShadow = true; out.add(mesh); }
  return out;
}

function swingState(time){

function dynamicProxies(time){

function inShade(x, y, z, list){

// ---------- particles (one draw call per system) ----------
const psVert = `attribute float aSize; attribute vec4 aCol; varying vec4 vCol; uniform float uScale;
  void main(){ vCol = aCol; vec4 mv = modelViewMatrix*vec4(position,1.); gl_PointSize = aSize*uScale/-mv.z; gl_Position = projectionMatrix*mv; }`;
const psFrag = `uniform sampler2D map; varying vec4 vCol; void main(){ vec4 t = texture2D(map, gl_PointCoord); gl_FragColor = vec4(vCol.rgb, vCol.a*t.a); if (gl_FragColor.a < .003) discard; }`;
function makePS(ps, n, tex, blending){
  ps.n = n; ps.i = 0; ps.p = Array.from({length:n}, () => ({life:0}));
  const g = new THREE.BufferGeometry();
  ps.pos = new Float32Array(n*3); ps.col = new Float32Array(n*4); ps.size = new Float32Array(n);
  g.setAttribute('position', new THREE.BufferAttribute(ps.pos, 3)); g.setAttribute('aCol', new THREE.BufferAttribute(ps.col, 4)); g.setAttribute('aSize', new THREE.BufferAttribute(ps.size, 1));
  ps.mat = new THREE.ShaderMaterial({uniforms:{map:{value:tex}, uScale:{value:innerHeight*DPR*0.6}}, vertexShader:psVert, fragmentShader:psFrag, transparent:true, depthWrite:false, blending});
  ps.points = new THREE.Points(g, ps.mat); ps.points.frustumCulled = false; scene.add(ps.points);
}
function emit(ps, x, y, z, n, c, o={}){
  for (let k = 0; k < n; k++){ const p = ps.p[ps.i = (ps.i + 1) % ps.n];
    const a = Math.random()*Math.PI*2, b = Math.random()*Math.PI - Math.PI/2, s = (o.spd ?? 2)*Math.random();
    Object.assign(p, {x:x + (Math.random() - .5)*(o.spread ?? 0.3), y:y + (Math.random() - .5)*(o.spreadY ?? 0.6), z:z + (Math.random() - .5)*(o.spread ?? 0.3),
      vx:Math.cos(a)*Math.cos(b)*s, vy:Math.sin(b)*s + (o.up ?? 0), vz:Math.sin(a)*Math.cos(b)*s, life:(o.life ?? 1)*(0.6 + Math.random()*0.4), max:o.life ?? 1,
      c, size:(o.size ?? 0.4)*(0.6 + Math.random()*0.8), grow:o.grow ?? 1, g:o.g ?? 0}); }
}
function updatePS(ps, dt){
  for (let i = 0; i < ps.n; i++){ const p = ps.p[i];
    if (p.life > 0){ p.life -= dt; p.vy -= p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt; p.vx *= 0.97; p.vz *= 0.97;
      const k = Math.max(0, p.life/p.max);
      ps.pos[i*3] = p.x; ps.pos[i*3+1] = p.y; ps.pos[i*3+2] = p.z;
      ps.col[i*4] = p.c[0]; ps.col[i*4+1] = p.c[1]; ps.col[i*4+2] = p.c[2]; ps.col[i*4+3] = p.c[3]*k;
      ps.size[i] = p.size*(1 + (1 - k)*(p.grow - 1)); }
    else { ps.col[i*4+3] = 0; ps.size[i] = 0; } }
  const g = ps.points.geometry; g.attributes.position.needsUpdate = g.attributes.aCol.needsUpdate = g.attributes.aSize.needsUpdate = true;
}
// Dust motes hang motionless in the stopped noon light; they only drift when Ilan disturbs them.
function makeDust(tex){

  const col = new Float32Array(N*4), size = new Float32Array(N); rngS = 404;
  for (let i = 0; i < N; i++){ const x = -6 + rnd()*196, y = rnd()*7, z = -3 + rnd()*5.5;
    dust.home.set([x, y, z], i*3); dust.pos.set([x, y, z], i*3);
    col.set([1.0, .82, .6, 0.35 + rnd()*0.35], i*4); size[i] = 0.025 + rnd()*0.035; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(dust.pos, 3)); g.setAttribute('aCol', new THREE.BufferAttribute(col, 4)); g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  dust.mat = new THREE.ShaderMaterial({uniforms:{map:{value:tex}, uScale:{value:innerHeight*DPR*0.6}}, vertexShader:psVert, fragmentShader:psFrag, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending});

function updateDust(dt){
  const px = P.x, py = P.y + 0.9;
  for (let i = 0; i < dust.n; i++){ const j = i*3; const x = dust.pos[j];
    if (Math.abs(x - px) > 3 && dust.vel[j] === 0) continue;
    const dx = x - px, dy = dust.pos[j+1] - py, dz = dust.pos[j+2], d2 = dx*dx + dy*dy*0.5 + dz*dz;
    if (d2 < 1.2){ const f = (1.2 - d2)*3*dt; dust.vel[j] += dx*f + P.vx*0.12*dt; dust.vel[j+1] += 0.4*f; dust.vel[j+2] += dz*f; }

  for (const mm of memMeshes) if (!mm.got){ mm.core.rotation.y += dt*2; mm.g.position.y = mm.m.y + Math.sin(time*2 + mm.m.x)*0.08; }

  // camera: steady through ordinary jumps, follows when you land higher or fall
  if (state === 'play'){
    if (P.ground || P.y < camY - 0.6 || !P.alive) camY += (P.y - camY)*Math.min(1, dt*4);
    camAhead += ((P.face*1.7 + P.vx*0.2) - camAhead)*Math.min(1, dt*2.4);
    const aspect = innerWidth/innerHeight, dist = Math.max(14.5, 7.2/(Math.tan(THREE.MathUtils.degToRad(19))*aspect));
    camLookT.set(P.x + camAhead, camY + 1.7, 0);
    camPosT.set(camLookT.x - 0.8, camLookT.y + 1.6 + dist*0.05, dist);
  }
  const k = state === 'cut' ? Math.min(1, dt*1.2) : Math.min(1, dt*7);
  camPos.lerp(camPosT, k); camLook.lerp(camLookT, k);
  shakeT = Math.max(0, shakeT - dt);
  const sh = shakeT > 0 ? shakeT*0.25 : 0;
  camera.position.set(camPos.x + (Math.random() - .5)*sh, camPos.y + (Math.random() - .5)*sh, camPos.z);
  camera.lookAt(camLook);
  fovKick = Math.max(0, fovKick - dt*14); const fov = 38 - fovKick; if (Math.abs(camera.fov - fov) > 0.01){ camera.fov = fov; camera.updateProjectionMatrix(); }
  sky.position.copy(camera.position);
  // sun and its shadow frustum follow the action
  const fx = state === 'play' || state === 'cut' ? (state === 'cut' && cutLines && cutLines[cutI].cam && cutLines[cutI].cam[1] > 5 ? camLook.x : P.x) : 0;
  sun.target.position.set(fx + 6, 0, -2); sun.position.copy(sun.target.position).addScaledVector(TO_SUN, 70);
  grade.uniforms.time.value = time;
}

// =====================================================================
// Audio: a low drone in the stopped city, and a few sounds made from filtered noise
// =====================================================================
const audio = {
  ctx:null,
  start(){
    if (this.ctx) return;
    try {
      const C = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = C.createGain(); this.master.gain.value = 0.7; this.master.connect(C.destination);
      const len = C.sampleRate*2, buf = C.createBuffer(1, len, C.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
      this.noise = buf;
      const drone = C.createGain(); drone.gain.value = 0.0; drone.connect(this.master);
      const lp = C.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380; lp.connect(drone);
      for (const f of [65.41, 98.0, 130.8]){ const o = C.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = (Math.random() - .5)*8;
        const g = C.createGain(); g.gain.value = f > 100 ? 0.25 : 0.5; o.connect(g); g.connect(lp); o.start(); }
      drone.gain.linearRampToValueAtTime(0.05, C.currentTime + 4);
      const wind = C.createBufferSource(); wind.buffer = buf; wind.loop = true;
      const bp = C.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 0.6;
      const wg = C.createGain(); wg.gain.value = 0.025; wind.connect(bp); bp.connect(wg); wg.connect(this.master); wind.start();
    } catch(e){ this.ctx = null; }
  },
  sfx(kind){
    const C = this.ctx; if (!C) return; const t = C.currentTime;
    const noise = (dur, f0, f1, q, vol, type='bandpass') => { const s = C.createBufferSource(); s.buffer = this.noise; const f = C.createBiquadFilter(); f.type = type; f.Q.value = q;
      f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur); const g = C.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur); };
    const tone = (dur, f0, f1, vol, type='sine') => { const o = C.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const g = C.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur); };
    if (kind === 'step'){ noise(0.45, 3000, 180, 1.2, 0.5); tone(0.5, 420, 70, 0.18); }
    if (kind === 'jump') noise(0.12, 900, 400, 0.8, 0.08);
    if (kind === 'cut'){ noise(0.16, 5000, 1500, 2, 0.25, 'highpass'); }
    if (kind === 'cloth') noise(0.9, 600, 2400, 0.7, 0.18);
    if (kind === 'death'){ tone(1.2, 160, 40, 0.3, 'triangle'); noise(1.0, 800, 90, 0.8, 0.3); }
    if (kind === 'burn') noise(0.7, 1800, 300, 0.6, 0.12);
    if (kind === 'rumble'){ noise(2.2, 120, 50, 0.7, 0.6, 'lowpass'); }
    if (kind === 'land') noise(0.09, 420, 160, 0.8, 0.12);
    if (kind === 'fizzle') noise(0.18, 1400, 500, 1.2, 0.07);
    if (kind === 'chime'){ tone(0.35, 660, 660, 0.09); tone(0.5, 990, 990, 0.07); }
    if (kind === 'collect'){ tone(0.7, 523, 1568, 0.14, 'triangle'); tone(0.9, 784, 784, 0.06); noise(0.4, 6000, 9000, 1, 0.05, 'highpass'); }
  }
};

// =====================================================================
// Boot
// =====================================================================
let last = performance.now(), frames = 0, acc = 0, ftAvg = 16, qT = 0;
const FIXED = 1/120;
function frame(now){
  const rdt = Math.min(0.1, (now - last)/1000); last = now;
  pollPad();
  if (state !== 'loading'){
    shadows = computeShadows(P.x - 14, P.x + 16, time);
    if (hitStop > 0) hitStop -= rdt;      // a short freeze-frame on Steps, hits and pickups
    else { acc += rdt; let n = 0; while (acc >= FIXED && n < 12){ update(FIXED); acc -= FIXED; n++; } if (n === 12) acc = 0; }
    updateVisuals(rdt); frames++;
  }
  // keep the frame rate smooth on slower phones by lowering render resolution
  ftAvg += (rdt*1000 - ftAvg)*0.05; qT += rdt;
  if (qT > 2 && state !== 'loading'){ qT = 0;
    if (ftAvg > 24 && curDPR > 0.75){ curDPR = Math.max(0.75, curDPR - 0.15); renderer.setPixelRatio(curDPR); composer.setPixelRatio(curDPR); }
    else if (ftAvg < 14 && curDPR < DPR){ curDPR = Math.min(DPR, curDPR + 0.1); renderer.setPixelRatio(curDPR); composer.setPixelRatio(curDPR); }
    if (ftAvg > 34) bloom.enabled = false; }
  composer.render();
  requestAnimationFrame(frame);
}
window.__kanchi = { get frames(){ return frames; }, get P(){ return P; }, get state(){ return state; }, get shadows(){ return shadows; }, get target(){ return target; }, get walkers(){ return walkers; },
  advance, held, pressed, CANOPIES, get objI(){ return objI; }, get memCount(){ return memCount; }, setStick(a){ stickAx = a; },
  skipToPlay(){ $('title').classList.add('hide'); $('sub').className = ''; document.body.classList.remove('cine'); state = 'play'; $('hud').classList.remove('hide'); },
  place(x, y, face=1){ P.x = x; P.y = y; P.vx = P.vy = 0; P.face = face; camPos.set(x, y + 2.5, 13); camLook.set(x, y + 1, 0); camPosT.copy(camPos); camLookT.copy(camLook); } };

requestAnimationFrame(() => setTimeout(() => {
  buildMaterials(); buildProxies(); buildWorld(); buildMemories(); newGame();
  $('hud').classList.add('hide');
  state = 'title'; $('loading').classList.add('hide'); setTimeout(() => $('loading').style.display = 'none', 900);
  last = performance.now(); requestAnimationFrame(frame);
}, 30));
</script>
